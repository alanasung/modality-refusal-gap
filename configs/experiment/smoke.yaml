# @package _global_
#
# Plumbing check only. Uses SyntheticVLM or tiny modular SmolVLM wiring — never
# reported as answering the unified architectural question.

defaults:
  - base_experiment
  - override /model: pythia160m
  - override /data: synthetic
  - override /eval: fast
  - override /run: debug
  - override /reporting: minimal
  - _self_

experiment:
  name: smoke
  task_id: E08
  description: Minimal end-to-end plumbing check. Not a result; not an architectural claim.
  stages: [render, matched, ocr_check, direction, layers, vlsbench, contrast, hydra, utility]
  tags: [smoke, synthetic, not-a-result]

model:
  name: HuggingFaceTB/SmolVLM-500M-Instruct
  dtype: FLOAT32
  device: CPU
  batch_size: 1
  trust_remote_code: true

data:
  n_items: 16

force_synthetic_vlm: true
vlm_name: HuggingFaceTB/SmolVLM-500M-Instruct
vlm_role: smoke
architecture: synthetic
allow_modular_as_subject: false

cache:
  namespace: smoke
