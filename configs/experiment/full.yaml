# @package _global_
#
# Scaled unified subject (Fuyu-8B) + matched modular contrast. GPU-bound.

defaults:
  - base_experiment
  - override /model: qwen1.5b
  - override /data: full
  - override /eval: strict
  - override /run: full
  - override /reporting: paper
  - _self_

experiment:
  name: full
  task_id: E03
  description: >
    Full-profile unified subject adept/fuyu-8b with modular contrast
    Qwen2-VL-2B on identical items. Requires a real GPU.
  stages: [render, matched, ocr_check, direction, layers, vlsbench, contrast, hydra, utility]
  tags: [full, gpu-required, unified]

model:
  name: adept/fuyu-8b
  batch_size: 2
  dtype: FLOAT16
  device: AUTO
  trust_remote_code: true
  max_new_tokens: 64
  temperature: 0.0

force_synthetic_vlm: false
vlm_name: adept/fuyu-8b
vlm_role: subject
architecture: unified
allow_modular_as_subject: false
modular_contrast: Qwen/Qwen2-VL-2B-Instruct
quantization: none

cache:
  namespace: full
